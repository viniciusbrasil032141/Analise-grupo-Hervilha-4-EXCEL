<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Grupo TIMO</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--ink-m:#5a5a5a;--ink-f:#9a9a9a;
  --paper:#f8f6f2;--cream:#f0e8dc;--border:#d0c4b0;--rule:#c0a880;
  --green:#1e6b3a;--green-l:#e4f0ea;--red:#8b2020;--red-l:#fdf0f0;
  --gold:#9a7208;--blue:#1a3d6b;
  --c1:#2d6a4f;--c2:#8b3a1e;--c3:#1a4d7a;
}
body{font-family:"DM Sans",sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
.hdr{background:var(--ink);color:#faf8f4;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hdr h1{font-family:"Playfair Display",serif;font-size:26px;font-weight:900}
.hdr h1 em{color:#c8a830;font-style:normal}
.hdr-sub{font-size:10px;color:#8a8070;margin-top:3px;font-family:"DM Mono",monospace;letter-spacing:1px}
.hdr-kpis{display:flex;gap:20px;flex-wrap:wrap}
.hkpi label{display:block;font-family:"DM Mono",monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6a6258;margin-bottom:2px}
.hkpi strong{font-family:"Playfair Display",serif;font-size:17px;color:#faf8f4}
.hkpi.pos strong{color:#7ab87a}.hkpi.neg strong{color:#e07070}.hkpi.gold strong{color:#c8a830}
.unit-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);padding:0 28px;overflow-x:auto}
.ubtn{padding:11px 18px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-f);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ubtn.active{color:var(--ink);font-weight:700}
.ubtn[data-u="Gruppo"].active{border-color:var(--gold)}
.ubtn[data-u="Centrale"].active{border-color:var(--c1)}
.ubtn[data-u="El Carbon JK"].active{border-color:var(--c2)}
.ubtn[data-u="Timo JK"].active{border-color:var(--c3)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tab-bar{display:flex;background:#f5f0e8;border-bottom:1px solid var(--border);padding:0 28px;overflow-x:auto}
.tbtn{padding:9px 14px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-f);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tbtn.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tab-pane{display:none}.tab-pane.active{display:block}
.page{padding:22px 28px 52px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--border);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:20px}
.kpi-c{background:#fff;padding:15px 13px}
.kl{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-f);display:block;margin-bottom:6px}
.kv{font-family:"Playfair Display",serif;font-size:21px;font-weight:700;display:block;line-height:1.1}
.ks{font-size:10px;color:var(--ink-f);margin-top:3px}
.kv.pos{color:var(--green)}.kv.neg{color:var(--red)}.kv.gold{color:var(--gold)}.kv.blue{color:var(--blue)}
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin-bottom:20px}
.chart-box{background:#fff;border:1px solid var(--border);border-radius:3px;padding:13px 14px}
.chart-box h4{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-f);margin-bottom:9px}
.mini-bars{display:flex;align-items:flex-end;gap:2px;height:64px;margin-bottom:3px}
.mb{flex:1;border-radius:1px 1px 0 0;min-width:3px;cursor:default;position:relative}
.mb:hover{opacity:.75}
.mb[title]:hover::after{content:attr(title);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:"DM Mono",monospace;font-size:10px;padding:3px 8px;border-radius:2px;white-space:nowrap;z-index:20;pointer-events:none}
.chart-lbls{display:flex;gap:2px}
.chart-lbls span{flex:1;font-family:"DM Mono",monospace;font-size:7px;color:var(--ink-f);text-align:center;overflow:hidden;white-space:nowrap}
.bp{background:var(--green)}.bn{background:#d06060}.bg{background:var(--gold)}.bb{background:var(--blue)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:3px;max-height:calc(100vh - 300px);overflow-y:auto;margin-top:16px}
.tw::-webkit-scrollbar{height:5px;width:5px}.tw::-webkit-scrollbar-track{background:var(--cream)}.tw::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
table.dt{border-collapse:collapse;width:max-content;min-width:100%}
table.dt thead th{background:var(--ink);color:#faf8f4;font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:9px 11px;white-space:nowrap;position:sticky;top:0;z-index:5;text-align:right}
table.dt thead th:first-child{text-align:left;position:sticky;left:0;z-index:10;min-width:210px;background:var(--ink)}
table.dt thead th.ct{background:#2a3020;border-left:2px solid rgba(255,255,255,.15)}
table.dt tbody td{padding:6px 11px;white-space:nowrap;border-bottom:1px solid var(--border);font-family:"DM Mono",monospace;font-size:11.5px;text-align:right}
table.dt tbody td:first-child{position:sticky;left:0;background:var(--paper);font-family:"DM Sans",sans-serif;font-weight:500;font-size:12px;text-align:left;z-index:4;border-right:1px solid var(--border)}
table.dt tbody tr:hover td{background:#ece6de}
table.dt tbody tr:hover td:first-child{background:#ece6de}
tr.sec td{background:var(--ink)!important;color:#faf8f4!important;font-family:"DM Mono",monospace!important;font-size:10px!important;letter-spacing:1px!important;font-weight:700!important;padding:7px 11px!important}
tr.sub td{background:var(--cream)!important;font-weight:700!important;border-top:1px solid var(--rule)!important}
tr.tot td{background:#1a2e1a!important;color:#faf8f4!important;font-weight:700!important;font-size:12px!important}
tr.ind td:first-child{padding-left:22px!important;color:var(--ink-m)!important;font-weight:400!important;font-size:11px!important}
.pos{color:var(--green)!important}.neg{color:var(--red)!important}.mu{color:var(--ink-f)!important}
td.ct{background:#f0e8d8!important;font-weight:700!important;border-left:2px solid var(--rule)!important}
.cw{overflow-x:auto;border:1px solid var(--border);border-radius:3px}
table.cm{border-collapse:collapse;width:100%}
table.cm th{background:var(--ink);color:#faf8f4;font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:9px 12px;white-space:nowrap;text-align:center}
table.cm th:first-child{text-align:left}
table.cm td{padding:7px 12px;border-bottom:1px solid var(--border);font-family:"DM Mono",monospace;font-size:11px;text-align:center}
table.cm td:first-child{font-family:"DM Sans",sans-serif;font-weight:600;text-align:left}
table.cm tr:nth-child(even) td{background:var(--cream)}
table.cm tr.trpos td{background:#e4f0ea!important}
table.cm tr.trneg td{background:#fff0f0!important}
table.cm tr.trtot td{background:var(--ink)!important;color:#faf8f4!important;font-weight:700!important}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.mbtn{padding:5px 12px;border:1px solid var(--border);border-radius:100px;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#fff;cursor:pointer;color:var(--ink-m)}
.mbtn.active{background:var(--ink);color:#faf8f4;border-color:var(--ink)}
.tlbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-f)}
.note{background:#fff8e8;border:1px solid #d4aa50;border-left:4px solid var(--gold);border-radius:3px;padding:11px 15px;margin-bottom:16px;font-size:12.5px;line-height:1.6;color:#5a4410}
</style>
</head>

var curUnit = "Gruppo";
var curMode = "val";

function fmtK(v) {
  var a = Math.abs(v);
  if (a >= 1000000) return "R$ " + (v/1000000).toFixed(1).replace(".",",") + "M";
  if (a >= 1000) return "R$ " + Math.round(v/1000) + "K";
  return "R$ " + Math.round(v);
}
function fmtF(v) {
  if (v === 0) return "-";
  if (!v) return "-";
  return "R$ " + Math.round(Math.abs(v)).toLocaleString("pt-BR");
}
function fmtP(v) { return v ? (v*100).toFixed(1) + "%" : "-"; }
function vc(v) { return v > 0 ? "pos" : v < 0 ? "neg" : "mu"; }
function tot(arr, k) {
  var s = 0;
  for (var i = 0; i < arr.length; i++) s += arr[i][k] || 0;
  return s;
}
function getData() { return D[curUnit] || []; }
function find(arr, lbl) {
  for (var i = 0; i < arr.length; i++) if (arr[i].label === lbl) return arr[i];
  return null;
}

function setUnit(btn) {
  curUnit = btn.getAttribute("data-u");
  var btns = document.querySelectorAll(".ubtn");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
  btn.classList.add("active");
  buildAll();
}

function showTab(btn, id) {
  var panes = document.querySelectorAll(".tab-pane");
  for (var i = 0; i < panes.length; i++) panes[i].classList.remove("active");
  var tbtns = document.querySelectorAll(".tbtn");
  for (var i = 0; i < tbtns.length; i++) tbtns[i].classList.remove("active");
  document.getElementById("tab-" + id).classList.add("active");
  btn.classList.add("active");
}

function setMode(m) {
  curMode = m;
  document.getElementById("bval").className = "mbtn" + (m === "val" ? " active" : "");
  document.getElementById("bpct").className = "mbtn" + (m === "pct" ? " active" : "");
  buildDRE();
}

function buildHdr() {
  var g = D["Gruppo"];
  var tRL = tot(g, "receita_liquida"), tLB = tot(g, "lucro_bruto"), tRE = tot(g, "resultado_exercicio");
  var pos = 0;
  for (var i = 0; i < g.length; i++) if (g[i].resultado_exercicio > 0) pos++;
  var el = document.getElementById("hkpis");
  el.innerHTML = "";
  var kpis = [
    {l:"Rec. Liq. Grupo", v:fmtK(tRL), c:""},
    {l:"Margem Bruta", v:fmtP(tRL ? tLB/tRL : 0), c:"pos"},
    {l:"Resultado Exercicio", v:fmtK(tRE), c:tRE>=0?"pos":"neg"},
    {l:"Meses Positivos", v:pos+"/"+g.length, c:"gold"}
  ];
  for (var i = 0; i < kpis.length; i++) {
    var d = document.createElement("div");
    d.className = "hkpi " + kpis[i].c;
    d.innerHTML = "<label>" + kpis[i].l + "</label><strong>" + kpis[i].v + "</strong>";
    el.appendChild(d);
  }
}

function addChart(parent, title, data, valFn, clsFn) {
  var box = document.createElement("div"); box.className = "chart-box";
  var h4 = document.createElement("h4"); h4.textContent = title; box.appendChild(h4);
  var bDiv = document.createElement("div"); bDiv.className = "mini-bars"; box.appendChild(bDiv);
  var lDiv = document.createElement("div"); lDiv.className = "chart-lbls"; box.appendChild(lDiv);
  var vals = [];
  for (var i = 0; i < data.length; i++) vals.push(valFn(data[i]));
  var max = 0;
  for (var i = 0; i < vals.length; i++) if (Math.abs(vals[i]) > max) max = Math.abs(vals[i]);
  if (!max) max = 1;
  for (var i = 0; i < vals.length; i++) {
    var el = document.createElement("div");
    el.className = "mb " + clsFn(vals[i]);
    el.style.height = Math.max(3, Math.abs(vals[i])/max*60) + "px";
    el.title = data[i].label + ": " + fmtF(vals[i]);
    bDiv.appendChild(el);
    var s = document.createElement("span"); s.textContent = data[i].label; lDiv.appendChild(s);
  }
  parent.appendChild(box);
}

function buildKPIs(el, items) {
  var g = document.createElement("div"); g.className = "kpi-grid";
  for (var i = 0; i < items.length; i++) {
    var c = document.createElement("div"); c.className = "kpi-c";
    c.innerHTML = '<span class="kl">'+items[i].l+'</span><span class="kv '+(items[i].c||'')+'">'+items[i].v+'</span><div class="ks">'+(items[i].s||"")+"</div>";
    g.appendChild(c);
  }
  el.appendChild(g);
}

function buildTable(el, data, rows, getV, fmtV) {
  var wrap = document.createElement("div"); wrap.className = "tw";
  var tbl = document.createElement("table"); tbl.className = "dt";
  var thead = document.createElement("thead");
  var tr0 = document.createElement("tr");
  var th0 = document.createElement("th"); th0.textContent = "Linha DRE"; tr0.appendChild(th0);
  for (var i = 0; i < data.length; i++) {
    var th = document.createElement("th"); th.textContent = data[i].label; tr0.appendChild(th);
  }
  var thT = document.createElement("th"); thT.textContent = "TOTAL"; thT.className = "ct"; tr0.appendChild(thT);
  thead.appendChild(tr0); tbl.appendChild(thead);
  var tbody = document.createElement("tbody");
  for (var ri = 0; ri < rows.length; ri++) {
    var r = rows[ri];
    var tr = document.createElement("tr");
    if (r.type === "sec") {
      tr.className = "sec";
      var td = document.createElement("td"); td.textContent = r.label; td.colSpan = data.length + 2;
      tr.appendChild(td); tbody.appendChild(tr); continue;
    }
    tr.className = r.type || "";
    var tdL = document.createElement("td"); tdL.textContent = r.label; tr.appendChild(tdL);
    var sm = 0;
    for (var mi = 0; mi < data.length; mi++) {
      var v = getV(data[mi], r.k);
      sm += v;
      var td = document.createElement("td");
      td.textContent = fmtV(v, r.k, data[mi]);
      td.className = vc(v);
      tr.appendChild(td);
    }
    var tdT = document.createElement("td"); tdT.className = "ct " + vc(sm);
    tdT.textContent = fmtV(sm, r.k, null);
    tr.appendChild(tdT); tbody.appendChild(tr);
  }
  tbl.appendChild(tbody); wrap.appendChild(tbl); el.appendChild(wrap);
}

  {k:"_r", label:"RECEITA", type:"sec"},

  {k:"_n", label:"ABAIXO DA LINHA OPERACIONAL", type:"sec"},
  {k:"receita_nao_op", label:"(+) Rec. Nao Operacionais", type:"ind"},
  {k:"ir_csll", label:"(-) IR e CSLL", type:"ind"},

];

function buildVisao() {
  var el = document.getElementById("p-visao"); el.innerHTML = "";
  var d = getData();
  var tRL = tot(d,"receita_liquida"), tLB = tot(d,"lucro_bruto");
  var tRO = tot(d,"resultado_operacional"), tRE = tot(d,"resultado_exercicio");
  var tPes = tot(d,"pessoal"), tAdm = tot(d,"adm");
  var tNop = tot(d,"receita_nao_op"), tIR = tot(d,"ir_csll");
  var pos = 0;
  for (var i = 0; i < d.length; i++) if (d[i].resultado_exercicio > 0) pos++;
  var best = d[0] || {}, worst = d[0] || {};
  for (var i = 0; i < d.length; i++) {
    if (d[i].resultado_exercicio > best.resultado_exercicio) best = d[i];
    if (d[i].resultado_exercicio < worst.resultado_exercicio) worst = d[i];
  }
  if (curUnit !== "Gruppo") {
    var note = document.createElement("div"); note.className = "note";
    note.innerHTML = "<b>Composicao do Resultado do Exercicio:</b> Resultado Operacional <b>" +
      fmtK(tRO) + "</b> + Rec. Nao Operacionais <b>" + fmtK(tNop) +
      "</b> + IR/CSLL <b>" + fmtK(tIR) + "</b> = <b>" + fmtK(tRE) + "</b>";
    el.appendChild(note);
  }
  buildKPIs(el, [
    {l:"Receita Liq. Total", v:fmtK(tRL), c:"blue", s:"Periodo completo"},
    {l:"Margem Bruta Media", v:fmtP(tRL?tLB/tRL:0), c:"pos", s:"% Receita Liquida"},
    {l:"Res. Operacional", v:fmtK(tRO), c:tRO>=0?"pos":"neg", s:fmtP(tRL?tRO/tRL:0)+" da rec."},
    {l:"Resultado Exercicio", v:fmtK(tRE), c:tRE>=0?"pos":"neg", s:"Apos IR e nao-op."},
    {l:"Meses Positivos", v:pos+"/"+d.length, c:"gold", s:"Resultado exercicio"},
    {l:"Pessoal / Rec.", v:fmtP(tRL?tPes/tRL:0), c:"neg", s:fmtK(tPes)+" acum."},
    {l:"Adm / Rec.", v:fmtP(tRL?tAdm/tRL:0), c:"neg", s:fmtK(tAdm)+" acum."},
    {l:"Melhor Mes", v:best.label||"-", c:"pos", s:fmtK(best.resultado_exercicio||0)}
  ]);
  var cr1 = document.createElement("div"); cr1.className = "chart-row"; el.appendChild(cr1);
  var cr2 = document.createElement("div"); cr2.className = "chart-row"; el.appendChild(cr2);
  addChart(cr1, "Receita Liquida", d, function(m){return m.receita_liquida;}, function(){return "bb";});
  addChart(cr1, "Lucro Bruto", d, function(m){return m.lucro_bruto;}, function(){return "bg";});
  addChart(cr1, "Resultado do Exercicio", d, function(m){return m.resultado_exercicio;}, function(v){return v>=0?"bp":"bn";});
  addChart(cr2, "Pessoal (R$)", d, function(m){return Math.abs(m.pessoal);}, function(){return "bn";});
  addChart(cr2, "Desp. Adm (R$)", d, function(m){return Math.abs(m.adm);}, function(){return "bn";});
  addChart(cr2, "% Margem Bruta", d, function(m){return m.receita_liquida?m.lucro_bruto/m.receita_liquida:0;}, function(v){return v>=0.70?"bp":v>=0.55?"bg":"bn";});
}

function buildDRE() {
  var el = document.getElementById("p-dre"); el.innerHTML = "";
  var tb = document.createElement("div"); tb.className = "toolbar";
  tb.innerHTML = '<span class="tlbl">Modo:</span><button class="mbtn active" id="bval" onclick="setMode(\'val\')">Valores R$</button><button class="mbtn" id="bpct" onclick="setMode(\'pct\')">% Receita Liq.</button>';
  el.appendChild(tb);
  var d = getData();
  buildTable(el, d, DRE_ROWS,
    function(m, k) { if (k.charAt(0) === "_") return 0; return m[k] || 0; },
    function(v, k, m) {
      if (curMode === "pct") {
        var rl = m ? (m.receita_liquida || 1) : 1;
        return v ? fmtP(v/rl) : "-";
      }
      return fmtF(v);
    }
  );
}

function buildMargens() {

  buildKPIs(el, [
    {l:"Rec. Liq. Total", v:fmtK(tRL), c:"blue"},
    {l:"Lucro Bruto Total", v:fmtK(tLB), c:"pos"},
    {l:"Margem Bruta", v:fmtP(tRL?tLB/tRL:0), c:"pos", s:"% Rec. Liquida"},
    {l:"CMV Total", v:fmtK(Math.abs(tCMV)), c:"neg", s:fmtP(tRL?Math.abs(tCMV)/tRL:0)+" da rec."}
  ]);
  var cr = document.createElement("div"); cr.className = "chart-row"; el.appendChild(cr);
  addChart(cr, "Receita Liquida", d, function(m){return m.receita_liquida;}, function(){return "bb";});
  addChart(cr, "Lucro Bruto", d, function(m){return m.lucro_bruto;}, function(v){return v>=0?"bp":"bn";});
  addChart(cr, "% Margem Bruta", d, function(m){return m.receita_liquida?m.lucro_bruto/m.receita_liquida:0;}, function(v){return v>=0.70?"bp":v>=0.55?"bg":"bn";});
  var mrows = [
    {k:"_r", label:"RECEITA E MARGEM", type:"sec"},
    {k:"receita_bruta", label:"Receita Bruta", type:"sub"},
    {k:"deducoes", label:"(-) ICMS / Deducoes", type:"ind"},
    {k:"receita_liquida", label:"Receita Liquida", type:"sub"},
    {k:"custos_total", label:"(-) CMV + Depreciacao", type:"ind"},
    {k:"lucro_bruto", label:"Lucro Bruto", type:"sub"},
    {k:"mg_pct", label:"% Margem Bruta", type:"ind"}
  ];
  buildTable(el, d, mrows,
    function(m, k) { if (k === "mg_pct") return m.receita_liquida ? m.lucro_bruto/m.receita_liquida : 0; return m[k] || 0; },
    function(v, k) { return k === "mg_pct" ? fmtP(v) : fmtF(v); }
  );
}

function buildDespesas() {
  var el = document.getElementById("p-despesas"); el.innerHTML = "";
  var d = getData();
  var cr = document.createElement("div"); cr.className = "chart-row"; el.appendChild(cr);
  addChart(cr, "Pessoal", d, function(m){return Math.abs(m.pessoal);}, function(){return "bn";});
  addChart(cr, "Adm Geral", d, function(m){return Math.abs(m.adm);}, function(){return "bn";});
  addChart(cr, "Resultado Exercicio", d, function(m){return m.resultado_exercicio;}, function(v){return v>=0?"bp":"bn";});
  var drows = [
    {k:"_d", label:"DESPESAS OPERACIONAIS", type:"sec"},
    {k:"pessoal", label:"Despesas com Pessoal", type:"ind"},
    {k:"pes_pct", label:"% Pessoal / Rec.", type:"ind"},
    {k:"adm", label:"Despesas Administrativas", type:"ind"},
    {k:"adm_pct", label:"% Adm / Rec.", type:"ind"},
    {k:"aluguel", label:"  Aluguel", type:"ind"},
    {k:"energia", label:"  Energia Eletrica", type:"ind"},
    {k:"marketing", label:"  Marketing", type:"ind"},
    {k:"taxa_cartao", label:"  Taxa Cartao", type:"ind"},
    {k:"juros", label:"  Juros Passivos", type:"ind"},
    {k:"_r", label:"RESULTADO COMPLETO", type:"sec"},
    {k:"resultado_operacional", label:"Resultado Operacional", type:"sub"},
    {k:"receita_nao_op", label:"(+) Rec. Nao Operacionais", type:"ind"},
    {k:"ir_csll", label:"(-) IR e CSLL", type:"ind"},
    {k:"resultado_exercicio", label:"Resultado do Exercicio", type:"tot"},
    {k:"re_pct", label:"% Resultado / Rec.", type:"ind"}
  ];
  buildTable(el, d, drows,
    function(m, k) {
      if (k === "pes_pct") return m.receita_liquida ? m.pessoal/m.receita_liquida : 0;
      if (k === "adm_pct") return m.receita_liquida ? m.adm/m.receita_liquida : 0;
      if (k === "re_pct") return m.receita_liquida ? m.resultado_exercicio/m.receita_liquida : 0;
      return m[k] || 0;
    },
    function(v, k) {
      if (k === "pes_pct" || k === "adm_pct" || k === "re_pct") return fmtP(v);
      return fmtF(v);
    }
  );
}

function buildComp() {
  var el = document.getElementById("p-comp"); el.innerHTML = "";
  var grp = D["Gruppo"];
  var UNITS = ["Centrale", "El Carbon JK", "Timo JK"];
  var cr = document.createElement("div"); cr.className = "chart-row"; el.appendChild(cr);
  for (var ui = 0; ui < UNITS.length; ui++) {
    (function(u) {
      addChart(cr, u + " - Resultado", D[u], function(m){return m.resultado_exercicio;}, function(v){return v>=0?"bp":"bn";});
    })(UNITS[ui]);
  }
  addChart(cr, "Grupo - Resultado", grp, function(m){return m.resultado_exercicio;}, function(v){return v>=0?"bp":"bn";});
  var cw = document.createElement("div"); cw.className = "cw"; el.appendChild(cw);
  var tbl = document.createElement("table"); tbl.className = "cm";
  var thead = document.createElement("thead");
  var thr = document.createElement("tr");
  var headers = ["Mes","Centrale Rec.","Centrale Res.","El Carbon Rec.","El Carbon Res.","Timo JK Rec.","Timo JK Res.","Grupo Rec.","Grupo Res."];
  for (var i = 0; i < headers.length; i++) {
    var th = document.createElement("th"); th.textContent = headers[i]; thr.appendChild(th);
  }
  thead.appendChild(thr); tbl.appendChild(thead);
  var tbody = document.createElement("tbody");
  for (var gi = 0; gi < grp.length; gi++) {
    var lbl = grp[gi].label;
    var gRE = grp[gi].resultado_exercicio || 0;
    var gRL = grp[gi].receita_liquida || 0;
    var tr = document.createElement("tr");
    tr.className = gRE > 0 ? "trpos" : gRE < 0 ? "trneg" : "";
    var cells = [lbl];
    for (var ui = 0; ui < UNITS.length; ui++) {
      var m = find(D[UNITS[ui]], lbl);
      cells.push(m ? fmtK(m.receita_liquida) : "-");
      cells.push(m ? fmtK(m.resultado_exercicio) + (m.resultado_exercicio >= 0 ? " OK" : " -") : "-");
    }
    cells.push(fmtK(gRL));
    cells.push(fmtK(gRE) + (gRE >= 0 ? " OK" : " -"));
    for (var ci = 0; ci < cells.length; ci++) {
      var td = document.createElement("td"); td.textContent = cells[ci]; tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  var trT = document.createElement("tr"); trT.className = "trtot";
  var totCells = ["TOTAL"];
  for (var ui = 0; ui < UNITS.length; ui++) {
    totCells.push(fmtK(tot(D[UNITS[ui]], "receita_liquida")));
    totCells.push(fmtK(tot(D[UNITS[ui]], "resultado_exercicio")));
  }
  totCells.push(fmtK(tot(grp, "receita_liquida")));
  totCells.push(fmtK(tot(grp, "resultado_exercicio")));
  for (var i = 0; i < totCells.length; i++) {
    var td = document.createElement("td"); td.textContent = totCells[i]; trT.appendChild(td);
  }
  tbody.appendChild(trT);
  tbl.appendChild(tbody); cw.appendChild(tbl);
}

function buildAll() {
  buildVisao();
  buildDRE();
  buildMargens();
  buildDespesas();
  buildComp();
}

buildHdr();
buildAll();
</script>
